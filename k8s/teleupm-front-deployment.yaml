apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleupm-front-deployment
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teleupm-front
  template:
    metadata:
      labels:
        app: teleupm-front
    spec:
      containers:
        - name: front-container
          image: darthademie/tfg-multicanalidad-web:1.53
          imagePullPolicy: Always
          ports:
            - containerPort: 80