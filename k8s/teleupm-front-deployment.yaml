apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleupm-front-deployment
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teleupm-front
  template:
    metadata:
      labels:
        app: teleupm-front
    spec:
      containers:
        - name: front-container
          image: darthademie/tfg-multicanalidad-web:1.70
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          # OBLIGATORIO PARA EL HPA: Definir cuánto consume el contenedor
          resources:
            requests:
              cpu: "50m"       # 5% de un núcleo de CPU
              memory: "64Mi"   # 64 MB de RAM
            limits:
              cpu: "200m"      # Máximo 20% de un núcleo
              memory: "128Mi"  # Máximo 128 MB de RAM