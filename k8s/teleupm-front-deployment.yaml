apiVersion: apps/v1
kind: Deployment
metadata:
  name: teleupm-front-deployment
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: teleupm-front
  template:
    metadata:
      labels:
        app: teleupm-front
    spec:
      containers:
        - name: front-container
          image: darthademie/tfg-multicanalidad-web:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: teleupm-front-svc
  namespace: apps
spec:
  type: ClusterIP
  selector:
    app: teleupm-front
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teleupm-front-ingress
  namespace: apps
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - teleupm.com
      secretName: teleupm-tls-secret
  rules:
    - host: teleupm.com
      http:
        paths:
          - path: /flujos(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: teleupm-n8n-svc
                port:
                  number: 5678
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: teleupm-front-svc
                port:
                  number: 80