<div class="offer-block">

    <pre>🌺 HASTA EL <strong> 30% DE DESCUENTO </strong> EN TODA LA WEB | HASTA EL 21 DE JULIO A LAS 23:59H. 🌺</pre>

</div>

<app-horizontal-menu>
    <li style="list-style-type: none;"><app-logout-button></app-logout-button></li>
</app-horizontal-menu>

<div class="cpedidos">

    <table class="tpedidos">
        <caption><span class="table-title">Mis pedidos<br><br></span></caption>
        <thead>
            <tr>
            <th>Nombre Pedido</th>
            <th>Descripción</th>
            <th>Ver</th>
            </tr>
        </thead>
        <tbody>
            <ng-container>
                @for (item of pedidos | keyvalue; track item.key) {
                <tr>
                    <td>{{ item.value.nombre }}</td>
                    <td>{{ item.value.descripcion }}</td>
                    <td class="button-tabla">
                        <button 
                        class="button details-button button-tabla" 
                        type="button"
                        (click)="verDetalles(item.key)">Ver detalles</button>
                    </td>
                </tr>
            }
            </ng-container>
        </tbody>
    </table>

</div>
